name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    name: Lint und klinische Test-Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Die Testzahl steht absichtlich nicht im Schrittnamen: sie wuchs
      # mehrfach, waehrend die Beschriftung auf 65 stehen blieb. Die
      # verbindliche Zahl steht in AGENTS.md, Invariante 1.
      - name: Klinische Test-Suite
        run: npm test
